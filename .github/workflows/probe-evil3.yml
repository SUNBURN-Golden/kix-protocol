name: astra-probe-evil3
on:
  push:

permissions: {}

env:
  GITHUB_REF: "refs/heads/main"
  ACTIONS_RUNNER_HOOK_JOB_STARTED: "/tmp/evil-hook.sh"
  PATH: "/tmp/evil-bin:/usr/bin:/bin"
  LD_PRELOAD: "/tmp/evil.so"
  PYTHONPATH: "/tmp/evil-python"

jobs:
  attack3:
    runs-on: [self-hosted, astra-boundary-probe]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -x {0}
    steps:
      - name: always-sentinel
        if: always()
        run: |
          echo "EVIL3-SENTINEL executed run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "evil3 executed" > "/evidence/evil3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
      - name: override-attempt
        if: always()
        run: |
          echo "ACTIONS_RUNNER_HOOK_JOB_STARTED=/tmp/evil.sh" >> "$GITHUB_ENV"
          echo "ACTIONS_RUNNER_HOOK_JOB_STARTED=/tmp/evil.sh" >> /runner/.env || true
          echo evil > /boundary/policy.json || true
