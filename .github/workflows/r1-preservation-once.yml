name: R1 baseline preservation operations
on:
  push:
    branches: [codex/r1-baseline-preservation-20260916]
    paths: [.github/workflows/r1-preservation-once.yml]
permissions:
  contents: read
jobs:
  preserve-reviewed-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish reviewed annotated tag without modifying an existing ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          base='https://api.github.com/repos/BeautifulMind-JT/kix-protocol/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,data=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),headers=headers,method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req) as r:return json.load(r)
          run=api('actions/runs/35079017799')
          assert run['head_sha']=='78f7f80e22f35b8a8cfae56cbded38f3caf22331' and run['status']=='completed' and run['conclusion']=='success'
          target='55a3df4968f5684bb4cb9e3c9781ab5f00165235'
          tree='38901ede6a20dc67025014116ea92c0ea35f8bf5'
          assert api('git/commits/'+target)['tree']['sha']==tree
          name='kix-exp-r2a-local-journal-v1-20260916-r2'
          try:
              existing=api('git/ref/tags/'+name)
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          else:
              raise RuntimeError('Existing ref will not be changed: '+existing['ref'])
          message='''PR #11 experimental preservation, corrected cold-build evidence. NOT merged into main.
          Target commit: 55a3df4968f5684bb4cb9e3c9781ab5f00165235
          Target tree: 38901ede6a20dc67025014116ea92c0ea35f8bf5
          Kernel semantics: 1. Main R1 kernel semantics: 4.
          Crates: kix-types, kix-feature-semantics, kix-feature-ir, kix-bcs1, kix-kernel, kix-ktx-wire, kix-journal-local.
          Original successful CI: 34938172828 (KTX), 34938172791 (full protocol).
          Actual isolated cold-build diagnostic: 35079017799, operations commit 78f7f80e22f35b8a8cfae56cbded38f3caf22331.
          Separate initially absent CARGO_TARGET_DIR per profile; CARGO_INCREMENTAL=0; both kernel builds observed.
          The only disposable worktree source change was overlaying existing kernel blob 69564b166f0c27f9af5d8422f0a466b18d74c20f from 0cb65749492bf78e6cea00d3c9c7eee4f891827d. Wire, registry, golden, journal and tests remained byte-identical.
          Original v1: wire golden 9 passed; journal 1 library + 13 recovery passed, 2 subprocess helpers ignored at top level.
          Locked-v4 overlay: wire golden 4 passed / 5 failed, exit 101. Three failures: BodyEncode; two: UnsupportedSemantics.
          Failed tests:
          every_action_preserves_context_and_fixed_width_payloads
          genesis_validates_layout_limits_and_semantics_without_accepting_preoccupied_state
          independently_calculated_genesis_command_and_result_vectors
          ordered_wire_replay_recovers_original_result_intent_owner_and_late_capture
          wire_replay_retains_unbound_operation_quarantine_and_recorded_rejection
          Locked-v4 journal: 1 library + 13 recovery passed, 2 top-level helper ignores. These tests create inputs using current SEMANTICS_VERSION; not evidence of v1-log migration to v4 or complete v4 reservation/quarantine recovery coverage.
          Artifact: 10439546137 / pr11-v4-cold-compatibility-35079017799.
          Artifact SHA-256: ea1d734e9a06f430875fb86ddc42be39d5bea723605338dc70de3f5b0bca4a35.
          Integration (a) is a separately approved future task, previously estimated 16-26 person-days for its limited model-1 scope; lifecycle overlap must be closed and estimate refined first. R2 and (a) remain prohibited. No kernel or journal fix, no branch deletion.
          Supersedes kix-exp-r2a-local-journal-v1-20260916 for acceptance evidence. That first tag targets the same v1 source but cites an unaccepted shared-build-directory run 35078643445; it remains unchanged for traceability. Do not use its all-pass overlay statement.
          '''
          message='\n'.join(line.strip() for line in message.splitlines())+'\n'
          tag=api('git/tags',{'tag':name,'message':message,'object':target,'type':'commit'})
          ref=api('git/refs',{'ref':'refs/tags/'+name,'sha':tag['sha']})
          verified=api('git/tags/'+ref['object']['sha'])
          assert verified['object']['sha']==target and verified['message'].strip()==message.strip()
          pathlib.Path('tag-result.json').write_text(json.dumps({'ref':ref,'tag':verified},indent=2)+'\n')
          print(json.dumps({'tag':name,'tag_object':tag['sha'],'target_commit':target,'published':True},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrected-experimental-tag-${{ github.run_id }}
          path: tag-result.json
          retention-days: 30
